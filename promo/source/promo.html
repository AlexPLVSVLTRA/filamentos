// ---------- textures
function woodTexture(){
  const w=1024,h=1024,c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');
  const img=ctx.createImageData(w,h),d=img.data;const PL=170;

  for(let y=0;y<h;y++){const pl=Math.floor(y/PL),tone=0.9+0.18*hash(pl,7.7),yy=y%PL;
    for(let x=0;x<w;x++){

      let g=0.5+0.5*Math.sin((y+n)*0.42);g=Math.pow(g,2.5);

  for(const s of [fr,tab]){const ge=new THREE.ExtrudeGeometry(s,ext);ge.translate(0,0,-1.5);body.add(new THREE.Mesh(ge,blueMat));}
  const tg=new TextGeometry('NOAH',{font,size:20,depth:4.2,curveSegments:8,bevelEnabled:true,bevelThickness:.35,bevelSize:.3,bevelSegments:2});

function buildKey(len,mat,capMat,teeth){

  const ext={depth:2.2,bevelEnabled:true,bevelThickness:.3,bevelSize:.3,bevelSegments:2,curveSegments:28};
  const head=new THREE.Shape();head.absarc(7.5,0,11,0,Math.PI*2,false);const h=new THREE.Path();h.absarc(0,0,2.4,0,Math.PI*2,true);head.holes.push(h);

  else{const ge=new THREE.ExtrudeGeometry(head,ext);ge.translate(0,0,-1.1);body.add(new THREE.Mesh(ge,mat));}

  const bg=new THREE.ExtrudeGeometry(b,ext);bg.translate(0,0,-1.1);body.add(new THREE.Mesh(bg,mat));

              ring:{x:-9,y:89,l:[43,27,21],r:[9.4,8.8,8.2],s:.05},pinky:{x:-26,y:82,l:[34,21,18],r:[8.2,7.7,7.2],s:.12}};

    const kn=new THREE.Mesh(new THREE.SphereGeometry(d.r[0]*1.08,16,12),skin);kn.position.set(d.x,d.y-3,-2);hand.add(kn);fingers[k]=f;}

function setFingerCurl(f,c){f.joints[0].rotation.x=c[0];f.joints[1].rotation.x=c[1];f.joints[2].rotation.x=c[2];}
const IDX_CLOSED=[0.55,0.8,0.45],IDX_OPEN=[0.25,0.25,0.15];
let THUMB_CLOSED=null;const THUMB_OPEN={bx:0.25,by:-0.2,bz:-0.95,c1:0.05,c2:0.05};

// ---------- build world
const ttf=await new Promise(r=>{const l=new TTFLoader();l.reversed=true;l.load('Inter-Black.otf',r);});

worldUV(pg,70);const panel=new THREE.Mesh(pg,denMat);panel.castShadow=panel.receiveShadow=true;pocketG.add(panel);
const PANEL_FRONT=3.7;
{const pts3=curve.getPoints(120).map(p=>V(p.x,p.y-1.5,1.2));const hem=new THREE.Mesh(worldUV(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts3),240,3.2,12,false),70),denMat);hem.castShadow=hem.receiveShadow=true;pocketG.add(hem);
 const n=120,pos=[],col=[],idx=[];for(let i=0;i<=n;i++){const p=curve.getPoint(i/n);pos.push(p.x,p.y-4,PZ_BACK+0.5,p.x,p.y+45,PZ_BACK+0.5);col.push(0,0,0,0.75,0,0,0,0);}
 for(let i=0;i<n;i++){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3);}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,4));g.setIndex(idx);
 pocketG.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,depthWrite:false})));}
function lipY(x){let best=1e9,y=0;for(let i=0;i<=400;i++){const p=curve.getPoint(i/400);const d=Math.abs(p.x-x);if(d<best){best=d;y=p.y;}}return y;}
// stitching
{const stitchMat=new THREE.MeshStandardMaterial({color:0xd99a3a,roughness:.7});const dash=new THREE.CapsuleGeometry(.55,2.6,4,8);dash.rotateZ(Math.PI/2);
 const mats=[];const pts=curve.getSpacedPoints(160);
 const len=curve.getLength();const N=Math.floor(len/4.6);
 for(const off of [5,9.5])for(let i=0;i<N;i++){const t=i/N;const p=curve.getPointAt(t),tn=curve.getTangentAt(t);const nrm=new THREE.Vector2(tn.y,-tn.x);
   const m=new THREE.Matrix4().compose(V(p.x+nrm.x*off,p.y+nrm.y*off,PANEL_FRONT),new THREE.Quaternion().setFromEuler(new THREE.Euler(0,0,Math.atan2(tn.y,tn.x))),V(1,1,1));mats.push(m);}
 const im=new THREE.InstancedMesh(dash,stitchMat,mats.length);mats.forEach((m,i)=>im.setMatrixAt(i,m));im.castShadow=true;pocketG.add(im);
 const rv=new THREE.Mesh(new THREE.SphereGeometry(5,24,12,0,Math.PI*2,0,Math.PI/2),new THREE.MeshStandardMaterial({color:0xb87333,metalness:1,roughness:.35}));
 const e=curve.getPoint(1);rv.rotation.x=Math.PI/2;rv.scale.y=.5;rv.position.set(e.x-6,e.y-6,PANEL_FRONT);pocketG.add(rv);}

// ---------- scene timing
const DUR=14,N=DUR*FPS;
const T_SWITCH=6.75;
const POCKET_X=6;const LIP=lipY(POCKET_X);
const RING_Z=-11;
// hand orientations
const qTable=orientQ(V(-0.75,-0.6,-0.2),V(-0.1,-0.6,-0.8));
const qPocket=orientQ(V(-0.5,-0.82,-0.1),V(-0.1,-0.45,-0.88));

// ---------- simulation
const G=6000;
function resetSim(){for(const it of items){it.th=0;it.w=0;it.tx=0;it.wx=0;it.prev=null;it.prevV=null;it.pin=null;it.started=false;}}
const keysetQ=new THREE.Quaternion();
let lastFrame=-1;

function hangPivot(it){return keyset.localToWorld(attachLocal(it));}

function stepItems(t,dt,phase,blend){
  keyset.updateMatrixWorld(true);
  for(const it of items){
    const ib=it.blend;let piv=hangPivot(it);
    if(phase==='pocket'&&it.isTag){
      const pinY=LIP+1.2, zF=PANEL_FRONT+2.3;
      if(it.pin||piv.y<pinY){if(!it.pin)it.pin=V(piv.x,pinY,zF);piv=it.pin.clone();}
    }
    // pivot acceleration
    let ax=0,ay=0,az=0;
    if(it.prev&&ib>=1){const v=piv.clone().sub(it.prev).divideScalar(dt);if(it.prevV){const a=v.clone().sub(it.prevV).divideScalar(dt);ax=a.x;ay=a.y;az=a.z;}it.prevV=v;}
    else it.prevV=null;
    it.prev=piv.clone();
    ax=clamp(ax,-2e5,2e5);ay=clamp(ay,-2e5,2e5);az=clamp(az,-2e5,2e5);
    if(ib>=1){const sub=10,h=dt/sub,c=1.6;
      for(let s=0;s<sub;s++){const ge=G+ay;
        const az_=(-(ge/it.L)*Math.sin(it.th)-(ax/it.L)*Math.cos(it.th))-c*it.w;it.w+=az_*h;it.th+=it.w*h;
        const axx=(-(ge/it.L)*Math.sin(it.tx)+(az/it.L)*Math.cos(it.tx))-c*1.4*it.wx;it.wx+=axx*h;it.tx+=it.wx*h;}
      it.th=clamp(it.th,-1.2,1.2);
      if(phase==='pocket'){ if(it.isTag&&it.pin){if(it.tx>0){it.tx=0;it.wx=Math.min(0,it.wx)*-.3;}}else it.tx=clamp(it.tx,-.15,.15);}
    }
    // place
    const hq=keyset.quaternion.clone().multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(it.tx,0,it.off+it.th)));
    if(ib>=1){it.obj.position.copy(piv);it.obj.quaternion.copy(hq);}
    else{const e=eio(ib);it.obj.position.copy(vlerp(it.flatPos,piv,e));it.obj.quaternion.copy(it.flatQ.clone().slerp(hq,e));}
  }
}

// ---------- frame
const el=id=>document.getElementById(id);
function setCam(pos,look,up){camera.position.copy(pos);camera.up.copy(up).normalize();camera.lookAt(look);}
const topPos=tagC.clone().add(V(0,268,0));
let grabbedPos=null;let releasedPos=null;

function frame(f,draw){
  const t=f/FPS,dt=1/FPS;
  // ----- 2D layers
  const ph=P(0.5,3.0,t),sc=lerp(0.54,1.55,ph);
  const cx=lerp(1000,795,ph),cy=lerp(760,888,ph);
  el('photo').style.transform=`translate(${W/2-cx*sc}px,${H/2-cy*sc}px) scale(${sc}) rotate(${lerp(0,2.2,ph)}deg)`;
  el('photoWrap').style.opacity=1-P(2.65,3.05,t,x=>x);
  el('t1').style.opacity=P(0.25,0.75,t)*(1-P(2.0,2.45,t));el('t1').style.transform=`translateY(${lerp(30,0,P(0.25,0.9,t,eout))}px)`;
  el('t2').style.opacity=P(7.4,7.8,t)*(1-P(9.4,9.8,t));
  el('end').style.opacity=P(11.2,11.9,t);
  el('end').style.transform=`translateY(${lerp(40,0,P(11.2,12.1,t,eout))}px)`;
  const whip=Math.max(0,1-Math.abs(t-T_SWITCH)/0.22);
  el('flash').style.opacity=whip*0.25;
  canvas.style.filter=whip>0.02?`blur(${(whip*22).toFixed(1)}px)`:'none';
  el('vig').style.opacity=1;

  if(f===0||f<lastFrame){resetSim();grabbedPos=null;releasedPos=null;}
  lastFrame=f;
  const phase=t<T_SWITCH?'table':'pocket';
  tableG.visible=phase==='table';pocketG.visible=phase==='pocket';
  scene.background=phase==='table'?new THREE.Color(0x8a5a36):new THREE.Color(0x1d2c45);

  if(phase==='table'){
    sun.position.set(tagC.x-160,520,tagC.z-140);sun.target.position.copy(tagC);
    // camera
    const k=P(3.0,4.7,t);const lift=P(5.5,6.75,t,x=>x*x*(3-2*x));
    const pos34=V(tagC.x+30,230,tagC.z+400),look34=V(tagC.x-15,20,tagC.z-10);
    let pos=vlerp(topPos,pos34,k),look=vlerp(tagC,look34,k);
    pos.add(V(0,lerp(0,60,lift),lerp(0,40,lift)));look.add(V(-10*lift,lerp(0,110,lift),lerp(0,25,lift)));
    const whipUp=P(6.45,T_SWITCH,t,ein);look.y+=whipUp*260;
    const up=V(0,0,-1).lerp(V(0,1,0),clamp(k*1.5,0,1)).normalize();
    pos.x+=Math.sin(t*0.6)*3;
    setCam(pos,look,up);
    // hand
    const arrive=P(3.9,5.25,t,eout);
    const grip=P(5.12,5.45,t);
    const start=ringTop.clone().add(V(300,170,60));
    let target=vlerp(start,ringTop.clone().add(V(0,0.4,0)),arrive);
    const L1=P(5.5,6.5,t),L2=P(6.35,T_SWITCH+.2,t,ein);
    target.add(V(lerp(0,-14,L1),lerp(0,135,L1)+L2*260,lerp(0,38,L1)));
    poseHand(hand,grip,lerp(0.35,0.9,grip));
    placeHand(hand,qTable,target);hand.visible=t>3.6;
    // keyset
    const lifted=t>=5.5;
    if(lifted){keyset.position.copy(target);}else{keyset.position.copy(ringTop);}
    const hb=clamp((keyset.position.y-ringTop.y)/(R*2.2),0,1);
    keyset.quaternion.copy(flatQ.clone().slerp(new THREE.Quaternion(),eio(hb)));
    for(const it of items){const raised=keyset.position.y-ringTop.y-R*1.2;it.blend=clamp(raised/(it.L*1.6),0,1);if(it.blend>=1&&!it.started){it.started=true;it.th=it.isTag?-0.5:it.fan*0.4;it.w=0;}}
    stepItems(t,dt,'table');
  }else{
    sun.position.set(260,420,520);sun.target.position.set(0,0,0);
    const tp=t-T_SWITCH;
    // hand path
    const lipT=V(POCKET_X,LIP,RING_Z);
    const p0=V(170,LIP+300,RING_Z+10),p1=V(POCKET_X+8,LIP+95,RING_Z),p2=V(POCKET_X,LIP+16,RING_Z),p3=V(POCKET_X,LIP-6,RING_Z),p4=V(220,LIP+300,RING_Z+40);
    let target;
    const a1=P(T_SWITCH,8.1,t,eout),a2=P(8.15,9.3,t),a3=P(9.3,9.75,t),a4=P(9.85,10.9,t,ein);
    target=vlerp(p0,p1,a1);target.lerp(p2,a2);target.lerp(p3,a3);target.lerp(p4,a4);
    const grip=1-P(9.6,9.95,t)*0.45;
    poseHand(hand,grip,0.9);placeHand(hand,qPocket,target);hand.visible=t<11.2;
    // keyset follows until release
    if(t<9.75){keyset.position.copy(target);releasedPos=null;}
    else{if(!releasedPos)releasedPos=keyset.position.clone();keyset.position.copy(releasedPos);}
    keyset.quaternion.identity();
    items[2].oz=lerp(2.8,17,P(T_SWITCH,7.4,t));
    for(const it of items)it.blend=1;
    if(Math.abs(t-T_SWITCH)<dt*0.6)for(const it of items){it.prev=null;it.prevV=null;it.th=it.isTag?0.6:-0.3;it.w=0;}
    stepItems(t,dt,'pocket');
    // camera
    const tagP=items[2].obj.position;
    const settle=P(T_SWITCH,7.5,t,eout);
    let pos=V(60,LIP+190+lerp(120,0,settle),440),look=V(25,LIP+40+lerp(140,0,settle),0);
    const k=P(10.0,13.6,t);
    pos.lerp(V(POCKET_X+35,LIP+40,330),k);look.lerp(V(POCKET_X+12,LIP-95,0),k);
    pos.x+=Math.sin(t*0.5)*4;
    setCam(pos,look,V(0,1,0));
  }
  if(draw)renderer.render(scene,camera);
}
window.N=N;
window.renderAt=(f)=>{if(f<lastFrame||lastFrame<0){lastFrame=-1;for(let i=0;i<f;i++)frame(i,false);}else{for(let i=lastFrame+1;i<f;i++)frame(i,false);}frame(f,true);return true;};
await new Promise(r=>{const im=el('photo');if(im.complete)r();else im.onload=r;});
await document.fonts.ready;
window.ready=true;
</script></body></html>
